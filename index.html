<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FILIONERZY — Gra o Milion</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:radial-gradient(circle at top,#243a83,#080e2b 65%);color:#fff;min-height:100vh}main{max-width:850px;margin:auto;padding:20px}h1{text-align:center;color:#ffe175;letter-spacing:2px;font-size:clamp(32px,7vw,58px);margin:14px 0 0}.sub{text-align:center;color:#bac9ff;margin-bottom:24px}.panel{background:#101c4e;border:2px solid #5673c2;border-radius:20px;padding:22px;box-shadow:0 10px 30px #0005}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#cbd5ff}.question{text-align:center;font-size:clamp(21px,4vw,34px);font-weight:700;margin:30px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:2px solid #6685d9;border-radius:13px;background:#1c3075;color:white;padding:16px;font-size:17px;font-weight:650;cursor:pointer}button:disabled{opacity:.55;cursor:default}button:hover:not(:disabled){background:#314c9e}.answers button{text-align:left;min-height:75px}.answers button.selected{border-color:#ffd95a;background:#5a4692}.answers button.correct{border-color:#66e6a1;background:#116548}.answers button.wrong{border-color:#ff8585;background:#8c2c49}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}.primary{background:#e7b939;color:#17204c;border-color:#fff0a4}.status{text-align:center;min-height:30px;margin:20px 0 4px;font-size:20px;font-weight:700}.ranking{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.person{background:#19285b;border-radius:12px;padding:12px;text-align:center}.person.active{outline:2px solid #ffdf67}.person strong{display:block;font-size:22px}.hidden{display:none}.foot{text-align:center;color:#aab9ed;font-size:13px;margin:20px 0}@media(max-width:520px){.answers{grid-template-columns:1fr}main{padding:12px}.panel{padding:14px}}
</style>
</head>
<body><main><h1>🏆 FILIONERZY</h1><div class="sub">Rodzinna gra o milion • Edycja urodzinowa Filipa 🎂</div>
<div class="panel"><div class="top"><span id="round">Runda 1 z 12</span><span id="player">Na gorącym krześle: Filip</span></div><div class="question" id="question">Gotowi na rodzinny teleturniej?</div><div class="answers" id="answers"></div><div class="status" id="status"></div><div class="actions"><button class="primary" id="confirm" onclick="confirmAnswer()" disabled>Zatwierdź odpowiedź</button><button id="next" onclick="nextTurn()" class="hidden">Dalej →</button></div></div>
<div class="ranking" id="ranking"></div><p class="foot">Wersja testowa 1 • W kolejnym etapie dodamy pilot na telefonie i koła ratunkowe.</p></main>
<script>
const players=[{name:'Filip',level:'medium',score:0},{name:'Marcel',level:'medium',score:0},{name:'Antek',level:'easy',score:0},{name:'Monika',level:'hard',score:0},{name:'Tata',level:'hard',score:0}];
const bank={
easy:[
['Ile nóg ma pies?','Dwie','Cztery','Sześć','Osiem',1],['Jakiego koloru jest trawa?','Zielonego','Niebieskiego','Czerwonego','Fioletowego',0],['Co daje nam kura?','Miód','Jajka','Mleko','Wełnę',1],['Ile to 3 + 4?','5','6','7','8',2],['Które zwierzę miauczy?','Pies','Kot','Koń','Krowa',1],['Co świeci w dzień na niebie?','Księżyc','Latarka','Słońce','Gwiazda polarna',2],['Jak nazywa się młode psa?','Kociak','Szczeniak','Cielak','Źrebak',1],['Ile palców jest u jednej dłoni?','4','5','6','10',1],['Jaki owoc jest zwykle żółty?','Banan','Jagoda','Wiśnia','Śliwka',0],['Co zakładamy na stopy?','Czapkę','Rękawiczki','Buty','Szalik',2],['Ile dni ma tydzień?','5','6','7','8',2],['Czym piszemy w zeszycie?','Łyżką','Ołówkiem','Widelcem','Szczotką',1]],
medium:[
['Jaka planeta jest największa?','Mars','Jowisz','Wenus','Merkury',1],['Ile minut trwa połowa meczu piłkarskiego?','30','40','45','60',2],['Jak nazywa się główna postać gry Minecraft?','Steve','Sonic','Mario','Kratos',0],['Ile boków ma sześciokąt?','5','6','7','8',1],['Jaki gaz jest niezbędny człowiekowi do oddychania?','Hel','Tlen','Azot','Wodór',1],['Który kontynent jest największy?','Europa','Afryka','Azja','Australia',2],['Co mierzymy termometrem?','Prędkość','Temperaturę','Wagę','Odległość',1],['Ile wynosi 12 × 8?','84','92','96','108',2],['Jak nazywa się naturalny satelita Ziemi?','Mars','Księżyc','Słońce','Wenus',1],['Jaka jest stolica Włoch?','Mediolan','Rzym','Neapol','Turyn',1],['Który pierwiastek ma symbol Fe?','Fluor','Żelazo','Fosfor','Złoto',1],['Ile stopni ma kąt prosty?','45','60','90','180',2]],
hard:[
['W którym roku Polska weszła do Unii Europejskiej?','1999','2002','2004','2007',2],['Który pierwiastek ma liczbę atomową 79?','Srebro','Złoto','Miedź','Platyna',1],['Kto napisał „Lalkę”?','Sienkiewicz','Prus','Żeromski','Reymont',1],['Jak nazywa się najgłębszy rów oceaniczny?','Mariański','Portorykański','Jawajski','Tonga',0],['Ile wynosi pierwiastek kwadratowy z 144?','10','11','12','14',2],['Który kraj ma stolicę w Ottawie?','Australia','Kanada','Nowa Zelandia','USA',1],['Co oznacza skrót DNA po polsku?','Kwas deoksyrybonukleinowy','Kwas rybonukleinowy','Dwutlenek azotu','Deoksyryboza',0],['Kto namalował „Gwiaździstą noc”?','Monet','Picasso','Van Gogh','Rembrandt',2],['Który ocean jest najmniejszy?','Atlantycki','Indyjski','Arktyczny','Spokojny',2],['W którym wieku rozpoczęła się rewolucja francuska?','XVII','XVIII','XIX','XX',1],['Jaką jednostką mierzymy opór elektryczny?','Wolt','Amper','Om','Wat',2],['Ile kości ma zwykle dorosły człowiek?','186','206','226','246',1]]};
let turn=0,selected=-1,locked=false;const $=id=>document.getElementById(id);
function drawRanking(){ $('ranking').innerHTML=players.map((p,i)=>`<div class="person ${turn<60&&i===turn%5?'active':''}">${p.name}<strong>${p.score} pkt</strong></div>`).join('') }
function render(){drawRanking();selected=-1;locked=false;$('status').textContent='';$('confirm').classList.remove('hidden');$('confirm').disabled=true;$('next').classList.add('hidden');if(turn>=60){$('round').textContent='Koniec gry';$('player').textContent='Wielki finał';$('question').textContent='🏆 MISTRZ RODZINY: '+[...players].sort((a,b)=>b.score-a.score)[0].name+'!';$('answers').innerHTML=[...players].sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="person">${i+1}. ${p.name} — ${p.score} pkt</div>`).join('');$('confirm').classList.add('hidden');return}const p=players[turn%5],q=bank[p.level][Math.floor(turn/5)];$('round').textContent='Runda '+(Math.floor(turn/5)+1)+' z 12';$('player').textContent='Na gorącym krześle: '+p.name;$('question').textContent=q[0];$('answers').innerHTML=q.slice(1,5).map((a,i)=>`<button onclick="choose(${i})" id="a${i}">${'ABCD'[i]}. ${a}</button>`).join('')}
function choose(i){if(locked)return;selected=i;for(let j=0;j<4;j++)$('a'+j).classList.toggle('selected',i===j);$('confirm').disabled=false}
function confirmAnswer(){if(selected<0||locked)return;locked=true;const p=players[turn%5],q=bank[p.level][Math.floor(turn/5)],right=q[5],points=Math.floor(turn/5)<4?100:Math.floor(turn/5)<8?200:300;if(selected===right){p.score+=points;$('status').textContent='✅ Dobra odpowiedź! +'+points+' pkt'}else{$('status').textContent='❌ Błędna odpowiedź! Poprawna: '+ 'ABCD'[right]}for(let i=0;i<4;i++){$('a'+i).disabled=true;$('a'+i).classList.remove('selected');if(i===right)$('a'+i).classList.add('correct');else if(i===selected)$('a'+i).classList.add('wrong')}$('confirm').classList.add('hidden');$('next').classList.remove('hidden');drawRanking()}
function nextTurn(){if(!locked)return;turn++;render()}
render();
</script></body></html>
